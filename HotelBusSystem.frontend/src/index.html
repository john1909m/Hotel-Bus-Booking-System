<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TravelEase — Hotels &amp; Bus Booking</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover amazing hotels and plan your travel with ease. Comfort, convenience and unforgettable experiences — all in one place.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Prevent theme & language flash -->
  <script>
    (function () {
      var savedTheme = localStorage.getItem('te-theme');
      var preferredTheme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', preferredTheme);

      var savedLang = localStorage.getItem('te-lang') || 'en';
      document.documentElement.setAttribute('lang', savedLang);
      document.documentElement.setAttribute('dir', savedLang === 'ar' ? 'rtl' : 'ltr');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
