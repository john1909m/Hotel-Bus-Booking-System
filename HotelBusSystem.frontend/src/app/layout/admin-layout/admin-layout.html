<div class="admin-shell" [class.sidebar-open]="sidebarOpen()">

  <!-- ─── Sidebar Overlay (mobile) ─────────────────────── -->
  <div class="sidebar-overlay" (click)="closeSidebar()" aria-hidden="true"></div>

  <!-- ─── Sidebar ──────────────────────────────────────── -->
  <aside class="sidebar" role="navigation" aria-label="Admin navigation">

    <!-- Sidebar Brand -->
    <div class="sidebar-brand">
      <a routerLink="/admin" class="brand-link" aria-label="TravelEase Admin">
        <svg width="26" height="26" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="14" fill="var(--color-primary)"/>
          <path d="M8 18 C8 18 10 10 14 10 C18 10 20 18 20 18" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          <circle cx="14" cy="10" r="2.5" fill="white"/>
        </svg>
        <span class="brand-text">TravelEase <small>Admin</small></span>
      </a>
      <button class="sidebar-close-btn" (click)="closeSidebar()" aria-label="Close sidebar">✕</button>
    </div>

    <!-- Nav Items -->
    <nav class="sidebar-nav" aria-label="Admin modules">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/admin' }"
          class="nav-item"
          (click)="closeSidebar()"
          [attr.aria-label]="item.label"
        >
          <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" aria-hidden="true">
          {{ currentUser()?.name?.charAt(0)?.toUpperCase() }}
        </div>
        <div class="user-details">
          <span class="user-name">{{ currentUser()?.name }}</span>
          <span class="user-role">Administrator</span>
        </div>
      </div>
      <button
        type="button"
        class="logout-btn"
        (click)="logout()"
        aria-label="Sign out"
      >
        <span aria-hidden="true">⏻</span>
      </button>
    </div>
  </aside>

  <!-- ─── Main Content Area ─────────────────────────────── -->
  <div class="admin-content">

    <!-- Top Bar -->
    <header class="admin-topbar" role="banner">
      <button
        class="sidebar-toggle-btn"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="sidebarOpen()"
        aria-controls="admin-sidebar"
        aria-label="Toggle sidebar"
      >
        <span></span><span></span><span></span>
      </button>

      <div class="topbar-right">
        <!-- Theme Toggle -->
        <button
          class="theme-toggle"
          [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
          (click)="toggleTheme()"
          id="admin-theme-toggle-btn"
        >
          <span class="toggle-track">
            <span class="toggle-icon moon" aria-hidden="true">🌙</span>
            <span class="toggle-thumb" [class.dark]="theme() === 'dark'"></span>
            <span class="toggle-icon sun" aria-hidden="true">☀️</span>
          </span>
        </button>

        <div class="topbar-user">
          <div class="user-avatar-sm" aria-hidden="true">
            {{ currentUser()?.name?.charAt(0)?.toUpperCase() }}
          </div>
          <span class="topbar-user-name">{{ currentUser()?.name }}</span>
        </div>

        <button
          type="button"
          class="topbar-logout-btn"
          (click)="logout()"
          aria-label="Sign out"
        >
          Sign Out
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="admin-main" id="admin-main-content">
      <router-outlet />
    </main>
  </div>
</div>
