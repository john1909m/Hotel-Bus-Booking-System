<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel API · OpenAPI reference</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.5;
            padding: 2rem 1.5rem;
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #0b1b33;
        }

        header h1 span {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.25rem 1rem;
            border-radius: 30px;
            letter-spacing: 0.3px;
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 0.5rem;
            color: #475569;
            font-size: 0.95rem;
        }

        .meta-info code {
            background: #e2e8f0;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #0b1b33;
            font-weight: 500;
        }

        .base-url {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 100px;
            padding: 0.4rem 1.2rem;
            font-size: 0.9rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            margin-top: 0.8rem;
        }

        .base-url strong {
            font-weight: 600;
            color: #2563eb;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab {
            background: none;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-radius: 12px 12px 0 0;
            transition: all 0.15s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab:hover {
            color: #0b1b33;
            background: #f1f5f9;
        }

        .tab.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            background: #eff6ff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Search bar */
        .search-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-bar input {
            flex: 1;
            min-width: 220px;
            padding: 0.6rem 1.1rem;
            border-radius: 100px;
            border: 1px solid #e2e8f0;
            font-size: 0.9rem;
            background: white;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .search-bar input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-bar .hint {
            font-size: 0.8rem;
            color: #94a3b8;
            align-self: center;
        }

        /* -------- Module (section) styles -------- */
        .module-section {
            margin-bottom: 2.5rem;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef2f6;
            overflow: hidden;
        }

        .module-header {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f6 100%);
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .module-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0b1b33;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .module-header h2 .module-icon {
            font-size: 1.4rem;
            line-height: 1;
        }

        .module-header .endpoint-count {
            background: #2563eb;
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            letter-spacing: 0.3px;
        }

        /* -------- Method groups inside a module -------- */
        .method-group {
            padding: 0.5rem 1rem 0.75rem;
            border-bottom: 1px dashed #e9eef3;
        }

        .method-group:last-child {
            border-bottom: none;
        }

        .method-group-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.4rem 0.5rem 0.4rem 0.75rem;
            margin-bottom: 0.3rem;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: background 0.12s;
        }

        .method-group-header:hover {
            background: #f1f5f9;
        }

        .method-group-header .arrow {
            font-size: 0.7rem;
            color: #94a3b8;
            transition: transform 0.2s ease;
            display: inline-block;
            width: 12px;
        }

        .method-group-header.collapsed .arrow {
            transform: rotate(-90deg);
        }

        .method-group-header .method-badge-sm {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            color: white;
            letter-spacing: 0.3px;
            min-width: 58px;
            text-align: center;
        }

        .method-group-header .count {
            color: #94a3b8;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
            font-size: 0.75rem;
            margin-left: auto;
        }

        .method-group-body {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.2rem 0 0.2rem 1.2rem;
            overflow: hidden;
        }

        .method-group-body.collapsed {
            display: none;
        }

        /* method badge colors */
        .method-get { background: #0b6e4f; }
        .method-post { background: #2563eb; }
        .method-put { background: #b45309; }
        .method-delete { background: #b91c1c; }
        .method-patch { background: #7c3aed; }

        /* -------- Endpoint card -------- */
        .endpoint-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 6px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #eef2f6;
            overflow: hidden;
            transition: box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .endpoint-card:hover {
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.07);
            border-color: #cbd5e1;
        }

        .endpoint-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem 0.85rem;
            padding: 0.7rem 1rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        .endpoint-header:hover {
            background: #f8fafc;
        }

        .method-badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 0.28rem 0.7rem;
            border-radius: 30px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            min-width: 62px;
            text-align: center;
            color: white;
            flex-shrink: 0;
        }

        .path {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.85rem;
            font-weight: 500;
            background: #f1f5f9;
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            color: #0b1b33;
            border: 1px solid #e2e8f0;
            word-break: break-word;
        }

        .op-summary {
            color: #334155;
            font-weight: 500;
            margin-left: auto;
            font-size: 0.8rem;
            background: #f8fafc;
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
        }

        .endpoint-details {
            display: none;
            padding: 1.1rem 1.3rem 1.3rem;
            background: #fbfdff;
            border-top: 1px solid #e9eef3;
        }

        .endpoint-card.open .endpoint-details {
            display: block;
        }

        .detail-section {
            margin-bottom: 1.2rem;
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .detail-label i {
            font-style: normal;
            font-size: 0.95rem;
        }

        .param-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e9eef3;
            font-size: 0.82rem;
        }

        .param-table th {
            text-align: left;
            padding: 0.5rem 0.9rem;
            background: #f1f5f9;
            font-weight: 600;
            color: #334155;
            font-size: 0.7rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            border-bottom: 1px solid #e2e8f0;
        }

        .param-table td {
            padding: 0.6rem 0.9rem;
            border-bottom: 1px solid #edf2f7;
            color: #1e293b;
        }

        .param-table tr:last-child td {
            border-bottom: none;
        }

        .param-table .required {
            color: #b91c1c;
            font-weight: 600;
            font-size: 0.7rem;
            background: #fee2e2;
            padding: 0.12rem 0.55rem;
            border-radius: 30px;
            display: inline-block;
        }

        .param-table .optional {
            color: #4b5563;
            background: #f1f5f9;
            padding: 0.12rem 0.55rem;
            border-radius: 30px;
            font-size: 0.7rem;
        }

        .response-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .response-status {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 0.25rem 0.9rem 0.25rem 0.7rem;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 10px;
            display: inline-block;
        }

        .status-2xx .status-dot { background: #16a34a; }
        .status-4xx .status-dot { background: #dc2626; }
        .status-5xx .status-dot { background: #b45309; }

        .response-desc {
            color: #475569;
            font-weight: 400;
            margin-left: 0.2rem;
        }

        .schema-ref {
            font-family: monospace;
            background: #eef2f6;
            padding: 0.1rem 0.55rem;
            border-radius: 30px;
            font-size: 0.78rem;
            color: #1e293b;
            border: 1px solid #d1d9e6;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            display: inline-block;
        }

        .schema-ref:hover {
            background: #dbeafe;
            color: #1e40af;
            border-color: #93c5fd;
        }

        .body-schema-box {
            background: white;
            border: 1px solid #e9eef3;
            border-radius: 10px;
            padding: 0.8rem 1.1rem;
            font-size: 0.82rem;
            line-height: 1.6;
        }

        .body-schema-box .body-title {
            font-weight: 600;
            color: #0b1b33;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .body-schema-box .body-title a {
            color: #2563eb;
            text-decoration: none;
            font-family: monospace;
            background: #eff6ff;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            border: 1px solid #bfdbfe;
            font-size: 0.78rem;
        }

        .body-schema-box .body-title a:hover {
            background: #dbeafe;
        }

        .no-params {
            color: #64748b;
            font-style: italic;
            font-size: 0.85rem;
            background: white;
            padding: 0.6rem 0.9rem;
            border-radius: 10px;
            border: 1px solid #e9eef3;
        }

        /* -------- Schemas tab styles -------- */
        .schema-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 1rem;
        }

        .schema-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #eef2f6;
            box-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: box-shadow 0.15s;
        }

        .schema-card:hover {
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
        }

        .schema-card-header {
            padding: 0.85rem 1.2rem;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f6 100%);
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .schema-card-header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #0b1b33;
            font-family: 'SF Mono', monospace;
        }

        .schema-card-header .type-badge {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            background: #dbeafe;
            color: #1e40af;
            letter-spacing: 0.3px;
        }

        .schema-card-body {
            padding: 0.8rem 1.2rem 1.2rem;
        }

        .schema-property {
            display: flex;
            align-items: flex-start;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f1f5f9;
            gap: 0.75rem;
        }

        .schema-property:last-child {
            border-bottom: none;
        }

        .schema-property .prop-name {
            font-family: 'SF Mono', monospace;
            font-weight: 600;
            font-size: 0.85rem;
            color: #0b1b33;
            min-width: 130px;
            flex-shrink: 0;
        }

        .schema-property .prop-name::after {
            content: '';
            display: inline-block;
        }

        .schema-property .prop-type {
            font-family: monospace;
            font-size: 0.78rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }

        .schema-property .prop-enum {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.2rem;
        }

        .schema-property .enum-val {
            font-size: 0.7rem;
            background: #fef3c7;
            color: #92400e;
            padding: 0.1rem 0.5rem;
            border-radius: 20px;
            font-family: monospace;
            border: 1px solid #fde68a;
        }

        .schema-property .prop-required {
            color: #b91c1c;
            font-size: 0.7rem;
            font-weight: 700;
            background: #fee2e2;
            padding: 0.1rem 0.5rem;
            border-radius: 20px;
            margin-left: 0.3rem;
        }

        .schema-no-props {
            color: #94a3b8;
            font-style: italic;
            font-size: 0.85rem;
            padding: 0.5rem 0;
        }

        .schema-description {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 0.6rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>
            🚌 Travel API
            <span>OpenAPI 3.1</span>
        </h1>
        <div class="meta-info">
            <div>📄 <strong>OpenAPI definition</strong> · v0</div>
            <div>🔗 <code>http://localhost:8080</code></div>
        </div>
        <div class="base-url">
            <span>🌐 Base URL</span>
            <strong>http://localhost:8080</strong>
        </div>
    </header>

    <div class="tabs">
        <button class="tab active" data-tab="endpoints">📋 Endpoints</button>
        <button class="tab" data-tab="schemas">📦 Schemas / DTOs</button>
    </div>

    <!-- Endpoints Tab -->
    <div class="tab-content active" id="tab-endpoints">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Filter endpoints by path, method, or module…">
            <span class="hint">Click any method group to collapse/expand · Click a card for details</span>
        </div>
        <div id="modules-container"></div>
    </div>

    <!-- Schemas Tab -->
    <div class="tab-content" id="tab-schemas">
        <div class="search-bar">
            <input type="text" id="schemaSearchInput" placeholder="🔍 Filter schemas by name or field…">
        </div>
        <div class="schema-grid" id="schemas-container"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // OpenAPI specification
    // --------------------------------------------------------------
    const openApiSpec = {
        "openapi": "3.1.0",
        "info": { "title": "OpenAPI definition", "version": "v0" },
        "servers": [{ "url": "http://localhost:8080", "description": "Generated server url" }],
        "paths": {

            "/api/rooms/{id}": {

                "put": { "tags": ["room-controller"], "operationId": "updateRoom", "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "integer", "format": "int64" } }], "requestBody": { "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RoomRequestDto" } } }, "required": true }, "responses": { "400": { "description": "Bad Request", "content": { "*/*": { "schema": { "type": "string" } } } }, "500": { "description": "Internal Server Error", "content": { "*/*": { "schema": { "type": "string" } } } }, "409": { "description": "Conflict", "content": { "*/*": { "schema": { "type": "string" } } } }, "404": { "description": "Not Found", "content": { "*/*": { "schema": { "type": "string" } } } }, "200": { "description": "OK", "content": { "*/*": { "schema": { "$ref": "#/components/schemas/RoomDto" } } } } } },
                "delete": { "tags": ["room-controller"], "operationId": "deleteRoom", "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "integer", "format": "int64" } }], "responses": { "400": { "description": "Bad Request", "content": { "*/*": { "schema": { "type": "string" } } } }, "500": { "description": "Internal Server Error", "content": { "*/*": { "schema": { "type": "string" } } } }, "409": { "description": "Conflict", "content": { "*/*": { "schema": { "type": "string" } } } }, "404": { "description": "Not Found", "content": { "*/*": { "schema": { "type": "string" } } } }, "200": { "description": "OK" } } }

    // --------------------------------------------------------------
    // Helper functions
    // --------------------------------------------------------------
    function schemaType(schema) {
        if (!schema) return 'any';
        if (schema.$ref) return schema.$ref.split('/').pop();
        if (schema.type === 'array') return `array of ${schemaType(schema.items)}`;
        if (schema.type === 'integer') return schema.format === 'int64' ? 'int64' : 'integer';
        if (schema.type === 'string') return schema.format ? `string(${schema.format})` : 'string';
        if (schema.type === 'number') return schema.format ? `number(${schema.format})` : 'number';
        if (schema.enum) return `enum(${schema.enum.join(', ')})`;
        return schema.type || 'object';
    }

    function getSchemaName(schema) {
        if (!schema) return null;
        if (schema.$ref) return schema.$ref.split('/').pop();
        return null;
    }

    // --------------------------------------------------------------
    // Module metadata
    // --------------------------------------------------------------
    const moduleMeta = {
        'user-controller':            { name: 'Users',              icon: '👤' },
        'room-controller':            { name: 'Rooms',              icon: '🛏️' },
        'payment-controller':         { name: 'Payments',           icon: '💳' },
        'hotel-controller':           { name: 'Hotels',             icon: '🏨' },
        'hotel-bus-stop-controller':  { name: 'Hotel Bus Stops',    icon: '🚏' },
        'hotel-booking-controller':   { name: 'Hotel Bookings',     icon: '📅' },
        'bus-controller':             { name: 'Buses',              icon: '🚌' },
        'bus-trip-controller':        { name: 'Bus Trips',          icon: '🗺️' },
        'bus-stop-controller':        { name: 'Bus Stops',          icon: '🚏' },
        'bus-seat-controller':        { name: 'Bus Seats',          icon: '💺' },
        'bus-route-controller':       { name: 'Bus Routes',         icon: '🛣️' },
        'bus-booking-controller':     { name: 'Bus Bookings',       icon: '🎫' },
        'default':                    { name: 'Other',              icon: '📌' }
    };

    const methodOrder = ['get', 'post', 'put', 'delete', 'patch'];
    const methodLabels = { get: 'GET', post: 'POST', put: 'PUT', delete: 'DELETE', patch: 'PATCH' };

    // --------------------------------------------------------------
    // Build modules
    // --------------------------------------------------------------
    const modules = {};
    Object.entries(openApiSpec.paths).forEach(([path, methods]) => {
        Object.entries(methods).forEach(([method, operation]) => {
            const tag = (operation.tags && operation.tags[0]) || 'default';
            if (!modules[tag]) {
                modules[tag] = {};
                methodOrder.forEach(m => modules[tag][m] = []);
            }
            modules[tag][method].push({ path, method, operation });
        });
    });

    const moduleOrder = [
        'user-controller', 'hotel-controller', 'hotel-booking-controller', 'hotel-bus-stop-controller',
        'room-controller', 'bus-controller', 'bus-trip-controller', 'bus-route-controller',
        'bus-stop-controller', 'bus-seat-controller', 'bus-booking-controller', 'payment-controller'
    ];

    const sortedModuleKeys = Object.keys(modules).sort((a, b) => {
        const ia = moduleOrder.indexOf(a);
        const ib = moduleOrder.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
    });

    // --------------------------------------------------------------
    // Render helpers
    // --------------------------------------------------------------
    function renderParamTable(parameters) {
        if (!parameters || !parameters.length) return `<div class="no-params">No parameters</div>`;
        return `
            <table class="param-table">
                <thead><tr><th>Name</th><th>In</th><th>Type</th><th>Required</th></tr></thead>
                <tbody>
                    ${parameters.map(p => `<tr>
                        <td><code>${p.name}</code></td>
                        <td>${p.in}</td>
                        <td><span class="schema-ref">${schemaType(p.schema)}</span></td>
                        <td>${p.required ? '<span class="required">required</span>' : '<span class="optional">optional</span>'}</td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
    }

    function renderRequestBody(requestBody) {
        if (!requestBody) return `<div class="no-params">None</div>`;
        const content = requestBody.content || {};
        const jsonContent = content['application/json'];
        if (jsonContent && jsonContent.schema) {
            const ref = getSchemaName(jsonContent.schema);
            if (ref) {
                return `<div class="body-schema-box">
                    <div class="body-title">Body schema: <a href="#" class="schema-link" data-schema="${ref}">${ref} →</a></div>
                    <div style="color:#64748b; font-size:0.8rem;">Click the schema name to view its fields in the Schemas tab.</div>
                </div>`;
            }
            return `<div class="body-schema-box">${schemaType(jsonContent.schema)}</div>`;
        }
        return `<div class="no-params">present (no schema)</div>`;
    }

    function renderResponses(responses) {
        const entries = Object.entries(responses || {});
        if (!entries.length) return `<div class="no-params">No responses</div>`;
        return `<div class="response-grid">
            ${entries.map(([code, resp]) => {
                let statusClass = 'status-2xx';
                if (code.startsWith('4')) statusClass = 'status-4xx';
                else if (code.startsWith('5')) statusClass = 'status-5xx';
                const desc = resp.description || '';
                let schemaInfo = '';
                if (resp.content) {
                    const contentTypes = Object.keys(resp.content);
                    if (contentTypes.length) {
                        const schema = resp.content[contentTypes[0]]?.schema;
                        if (schema) {
                            if (schema.$ref) {
                                const refName = schema.$ref.split('/').pop();
                                schemaInfo = ` · <a href="#" class="schema-link" data-schema="${refName}" style="color:#2563eb; text-decoration:none;">${refName}</a>`;
                            } else if (schema.type === 'array' && schema.items?.$ref) {
                                const itemRef = schema.items.$ref.split('/').pop();
                                schemaInfo = ` · array of <a href="#" class="schema-link" data-schema="${itemRef}" style="color:#2563eb; text-decoration:none;">${itemRef}</a>`;
                            } else if (schema.type) {
                                schemaInfo = ` · ${schema.type}`;
                            }
                        }
                    }
                }
                return `<div class="response-status ${statusClass}">
                    <span class="status-dot"></span>
                    <strong>${code}</strong>
                    <span class="response-desc">${desc}${schemaInfo}</span>
                </div>`;
            }).join('')}
        </div>`;
    }

    function renderEndpointCard({ path, method, operation }) {
        const opId = operation.operationId || '';
        const parameters = operation.parameters || [];
        const requestBody = operation.requestBody;
        const responses = operation.responses || {};
        return `
            <div class="endpoint-card" data-path="${path}" data-method="${method}">
                <div class="endpoint-header" onclick="this.parentElement.classList.toggle('open')">
                    <span class="method-badge method-${method}">${method}</span>
                    <span class="path">${path}</span>
                </div>
                <div class="endpoint-details">
                    <div style="font-size:0.78rem; color:#475569; margin-bottom:0.6rem;">
                        operationId: <code>${opId}</code>
                    </div>
                    <div class="detail-section">
                        <div class="detail-label"><i>🔹</i> Parameters</div>
                        ${renderParamTable(parameters)}
                    </div>
                    <div class="detail-section">
                        <div class="detail-label"><i>📦</i> Request body</div>
                        ${renderRequestBody(requestBody)}
                    </div>
                    <div class="detail-section">
                        <div class="detail-label"><i>📋</i> Responses</div>
                        ${renderResponses(responses)}
                    </div>
                </div>
            </div>`;
    }

    function renderMethodGroup(method, endpoints) {
        if (!endpoints.length) return '';
        return `
            <div class="method-group" data-method="${method}">
                <div class="method-group-header" onclick="toggleMethodGroup(this)">
                    <span class="arrow">▼</span>
                    <span class="method-badge-sm method-${method}">${methodLabels[method] || method.toUpperCase()}</span>
                    <span class="count">${endpoints.length} endpoint${endpoints.length > 1 ? 's' : ''}</span>
                </div>
                <div class="method-group-body">
                    ${endpoints.map(renderEndpointCard).join('')}
                </div>
            </div>`;
    }

    function renderModule(tag) {
        const meta = moduleMeta[tag] || moduleMeta['default'];
        const moduleData = modules[tag];
        const totalEndpoints = Object.values(moduleData).reduce((sum, arr) => sum + arr.length, 0);
        if (totalEndpoints === 0) return '';
        const methodSections = methodOrder.map(m => renderMethodGroup(m, moduleData[m] || [])).filter(Boolean).join('');
        return `
            <div class="module-section" data-module="${tag}">
                <div class="module-header">
                    <h2><span class="module-icon">${meta.icon}</span> ${meta.name}</h2>
                    <span class="endpoint-count">${totalEndpoints} endpoint${totalEndpoints > 1 ? 's' : ''}</span>
                </div>
                ${methodSections}
            </div>`;
    }

    // --------------------------------------------------------------
    // Render Schemas
    // --------------------------------------------------------------
    function renderSchemaProperty(name, prop) {
        let typeStr = prop.type || 'object';
        if (prop.format) typeStr += `(${prop.format})`;
        let enumHtml = '';
        if (prop.enum) {
            enumHtml = `<div class="prop-enum">${prop.enum.map(v => `<span class="enum-val">${v}</span>`).join('')}</div>`;
        }
        return `
            <div class="schema-property">
                <div class="prop-name">${name}</div>
                <div>
                    <span class="prop-type">${typeStr}</span>
                    ${enumHtml}
                </div>
            </div>`;
    }

    function renderSchemaCard(schemaName, schema) {
        const props = schema.properties || {};
        const propEntries = Object.entries(props);
        return `
            <div class="schema-card" data-schema-name="${schemaName.toLowerCase()}">
                <div class="schema-card-header">
                    <h3>${schemaName}</h3>
                    <span class="type-badge">${schema.type || 'object'}</span>
                </div>
                <div class="schema-card-body">
                    ${propEntries.length
                        ? propEntries.map(([name, prop]) => renderSchemaProperty(name, prop)).join('')
                        : '<div class="schema-no-props">No properties defined</div>'}
                </div>
            </div>`;
    }

    // --------------------------------------------------------------
    // Initial render
    // --------------------------------------------------------------
    document.getElementById('modules-container').innerHTML = sortedModuleKeys.map(renderModule).join('');

    const schemas = openApiSpec.components?.schemas || {};
    const schemaEntries = Object.entries(schemas).sort((a, b) => a[0].localeCompare(b[0]));
    document.getElementById('schemas-container').innerHTML = schemaEntries.map(([name, schema]) => renderSchemaCard(name, schema)).join('');

    // --------------------------------------------------------------
    // Toggle method group
    // --------------------------------------------------------------
    window.toggleMethodGroup = function (headerEl) {
        const body = headerEl.nextElementSibling;
        if (!body) return;
        const isCollapsed = body.classList.toggle('collapsed');
        headerEl.classList.toggle('collapsed', isCollapsed);
    };

    // --------------------------------------------------------------
    // Tabs
    // --------------------------------------------------------------
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
        });
    });

    // --------------------------------------------------------------
    // Schema link clicks (jump to schemas tab and highlight)
    // --------------------------------------------------------------
    document.addEventListener('click', (e) => {
        const link = e.target.closest('.schema-link');
        if (!link) return;
        e.preventDefault();
        const schemaName = link.dataset.schema;
        // Switch to schemas tab
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelector('.tab[data-tab="schemas"]').classList.add('active');
        document.getElementById('tab-schemas').classList.add('active');
        // Filter / scroll to schema
        const schemaCard = document.querySelector(`.schema-card[data-schema-name="${schemaName.toLowerCase()}"]`);
        if (schemaCard) {
            schemaCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            schemaCard.style.transition = 'box-shadow 0.3s, border-color 0.3s';
            schemaCard.style.boxShadow = '0 0 0 3px #2563eb, 0 8px 20px -4px rgba(37,99,235,0.3)';
            schemaCard.style.borderColor = '#2563eb';
            setTimeout(() => {
                schemaCard.style.boxShadow = '';
                schemaCard.style.borderColor = '';
            }, 2000);
        }
    });

    // --------------------------------------------------------------
    // Endpoint search
    // --------------------------------------------------------------
    document.getElementById('searchInput').addEventListener('input', function () {
        const q = this.value.trim().toLowerCase();
        document.querySelectorAll('.module-section').forEach(section => {
            let visibleInModule = 0;
            section.querySelectorAll('.method-group').forEach(group => {
                let visibleInGroup = 0;
                group.querySelectorAll('.endpoint-card').forEach(card => {
                    const path = card.dataset.path.toLowerCase();
                    const method = card.dataset.method.toLowerCase();
                    const moduleTag = section.dataset.module.toLowerCase();
                    const moduleName = (moduleMeta[moduleTag]?.name || '').toLowerCase();
                    const match = !q || path.includes(q) || method.includes(q) || moduleTag.includes(q) || moduleName.includes(q);
                    card.style.display = match ? '' : 'none';
                    if (match) visibleInGroup++;
                });
                group.style.display = visibleInGroup > 0 ? '' : 'none';
                if (visibleInGroup > 0) visibleInModule += visibleInGroup;
            });
            section.style.display = visibleInModule > 0 ? '' : 'none';
        });
    });

    // --------------------------------------------------------------
    // Schema search
    // --------------------------------------------------------------
    document.getElementById('schemaSearchInput').addEventListener('input', function () {
        const q = this.value.trim().toLowerCase();
        document.querySelectorAll('.schema-card').forEach(card => {
            const name = card.dataset.schemaName;
            const bodyText = card.textContent.toLowerCase();
            const match = !q || name.includes(q) || bodyText.includes(q);
            card.style.display = match ? '' : 'none';
        });
    });
</script>
</body>
</html>
