spring:
  application:
    name: Hotel_Bus_Booking_System
  datasource:
    driver-class-name: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@//localhost:1521/orclpdb
    username: HotelBusSystem
    password: hotelBusSystem

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  messages:
    basename: validation

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace