# Common & System Error Codes
INTERNAL_ERROR=حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى لاحقاً.
INVALID_ARGUMENT=تم تقديم وسيطة غير صالحة.
VALIDATION_FAILED=فشلت عملية التحقق من صحة البيانات.
RESOURCE_NOT_FOUND=المورد المطلوب غير موجود.
BOOKING_CONFLICT=تتعارض تواريخ أو عناصر الحجز مع حجز حالي.
MALFORMED_REQUEST=طلب غير صالح أو تنسيق بيانات غير صحيح.
TYPE_MISMATCH=نوع المعامل غير صالح.
INVALID_SORT=خاصية الترتيب غير صالحة.
DATA_CONFLICT=تعارض في البيانات. لا يمكن حفظ المورد في حالته الحالية.
CONCURRENT_MODIFICATION=تم تعديل هذا العنصر من قبل مستخدم آخر. يرجى التحديث والمحاولة مرة أخرى.
METHOD_NOT_ALLOWED=طريقة الطلب غير مدعومة.
TOO_MANY_REQUESTS=طلبات كثيرة جداً. يرجى المحاولة مرة أخرى لاحقاً.

# Authentication & Authorization Error Codes
AUTH_INVALID_CREDENTIALS=بيانات الاعتماد غير صالحة.
AUTH_EMAIL_ALREADY_EXISTS=البريد الإلكتروني مسجل بالفعل.
AUTH_ACCESS_DENIED=تم رفض الوصول. ليس لديك إذن لتنفيذ هذا الإجراء.
AUTH_TOKEN_EXPIRED=انتهت صلاحية جلستك. يرجى تسجيل الدخول مرة أخرى.
AUTH_TOKEN_INVALID=رمز المصادقة غير صالح. يرجى تسجيل الدخول مرة أخرى.
AUTH_UNAUTHORIZED=غير مصرح لك بالوصول.

# User Error Codes
USER_NOT_FOUND=المستخدم غير موجود.
USER_EMAIL_EXISTS=البريد الإلكتروني مسجل بالفعل.

# Hotel Error Codes
HOTEL_NOT_FOUND=الفندق غير موجود.
HOTEL_HAS_BOOKINGS=لا يمكن حذف الفندق لوجود حجوزات أو غرف مرتبطة به.
HOTEL_BUS_STOP_NOT_FOUND=موقف حافلات الفندق غير موجود.

# Room Error Codes
ROOM_NOT_FOUND=الغرفة غير موجودة.
ROOM_UNAVAILABLE=الغرفة غير متاحة للتواريخ المحددة.
